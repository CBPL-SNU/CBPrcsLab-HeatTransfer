<div class="conditions">
  <div class="input free"><label>Show</label>
    <div class="btn-row">
      <button class="btn toggle-layer is-active" data-layer="air" type="button" aria-pressed="true">Air drawn up the duct</button>
      <button class="btn toggle-layer is-active" data-layer="convection" type="button" aria-pressed="true">Convection</button>
      <button class="btn toggle-layer is-active" data-layer="radiation" type="button" aria-pressed="true">Radiation</button>
    </div>
  </div>
</div>

<div class="content">

  <div class="card-grid wide-left">
  <div class="card">
    <header><h2>HT14 in cross-section · the heater region to scale</h2><span class="click-hint">Click any part</span></header>
    <div class="card-body">
      <div class="apparatus-stage" id="apparatusStage"></div>
    </div>
  </div>

  <div class="card-stack">
  <div class="card">
    <header><h2>Parts</h2></header>
    <div class="card-body">
      <div class="part-list" id="componentList"></div>
      <section class="card-sub" aria-labelledby="componentTitle" aria-live="polite" aria-atomic="true">
        <div class="part-detail-heading"><h3 id="componentTitle">—</h3><span class="badge" id="componentBadge">—</span></div>
        <p class="part-measure" id="componentMeasure" hidden>—</p>
        <p id="componentSummary">—</p>
      </section>
    </div>
  </div>

  <!-- 이 화면이 답해야 할 세 번째 질문: 두 온도가 계산에 어떻게 들어가는가 -->
  <div class="card apparatus-balance">
    <header><h2>How T10 and T8 enter the balance</h2></header>
    <div class="card-body">
      <p class="formula">
        <span data-display="block" data-tex="Q_{\mathrm{conv}} ="></span>
        <span data-display="block" data-tex="hA\left(T_{10}-T_8\right)"></span>
      </p>
      <p class="formula">
        <span data-display="block" data-tex="Q_{\mathrm{rad}} ="></span>
        <span data-display="block" data-tex="\epsilon\sigma A\left(T_{10}^4-T_8^4\right)"></span>
      </p>
    </div>
  </div>
  </div>
  </div>

</div>
