<div class="conditions">
  <!-- 아무 두 case나 고른다. 처음에는 같은 흐름 속의 두 구 크기 -->
  <div class="input free"><label for="cLeft">Left</label><select id="cLeft" class="case-select"></select></div>
  <div class="input free"><label for="cRight">Right</label><select id="cRight" class="case-select"></select></div>
  <span class="divider"></span>
  <div class="input free"><label>Colour scale</label>
    <div class="btn-row segmented" role="group" aria-label="Colour scale">
      <button class="btn c-scale is-active" data-scale="shared" type="button" aria-pressed="true">Shared</button>
      <button class="btn c-scale" data-scale="own" type="button" aria-pressed="false">Each its own</button>
    </div>
  </div>
</div>

<div class="content">

  <p class="caution" id="cPending" role="status" hidden></p>

  <div class="card-grid wide-left">
  <div class="card">
    <header><h2>Each window is five bead diameters wide</h2><div class="btn-row segmented field-switch" role="group" aria-label="Field"><button class="btn c-field-type is-active" data-field="temperature" type="button" aria-pressed="true">Temperature</button><button class="btn c-field-type" data-field="speed" type="button" aria-pressed="false">Speed</button></div><span class="badge">OpenFOAM</span></header>
    <div class="card-body">
      <!-- 두 창은 같은 색 범위다. 같은 색이면 같은 온도다 -->
      <div class="b-viewer">
        <div class="viewer-stage">
          <canvas id="cCanvas" role="img" aria-label="The large and small black beads side by side."></canvas>
          <div class="viewer-cross viewer-cross--h" id="cCrossH" hidden></div>
          <div class="viewer-cross viewer-cross--v" id="cCrossV" hidden></div>
          <div class="viewer-tip num" id="cTip" hidden></div>
        </div>
        <p class="viewer-coords num" id="cCoords" aria-live="off"></p>
      </div>
      <!-- 재생은 그림 바로 아래. 오른쪽 그래프도 같은 시각을 따라간다 -->
      <div class="transport">
        <div class="transport-row">
          <button class="btn btn--primary" id="cPlay" type="button" title="Space">Play</button>
          <div class="scrubber">
            <input id="cTime" type="range" min="0" max="300" step="1" value="0" aria-label="Simulation time" title="← / → one frame">
            <div class="scrubber-ticks" id="cTicks" aria-hidden="true"></div>
          </div>
          <span class="unit num transport-time" id="cTimeValue">0 / 0 s</span>
        </div>
        <div class="transport-foot">
          <div class="btn-row segmented rate-row" role="group" aria-label="Playback speed relative to real time">
          <button class="btn play-rate" data-rate="1" type="button" aria-pressed="false">1×</button>
          <button class="btn play-rate" data-rate="2" type="button" aria-pressed="false">2×</button>
          <button class="btn play-rate" data-rate="5" type="button" aria-pressed="false">5×</button>
          <button class="btn play-rate" data-rate="10" type="button" aria-pressed="false">10×</button>
          <button class="btn play-rate" data-rate="25" type="button" aria-pressed="false">25×</button>
          </div>
          <span class="unit num" id="cPlayRateValue"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="card-stack">
  <div class="card">
    <header><h2>How far above the inlet air each bead reads</h2></header>
    <div class="card-body">
      <div class="values">
        <div><span class="k" id="cErrLeftName">—</span><span class="v" id="cErrLeft">—</span></div>
        <div><span class="k" id="cErrRightName">—</span><span class="v" id="cErrRight">—</span></div>
      </div>
      <div class="chart-frame"><canvas class="chart chart--short" id="cTempChart"></canvas></div>
      <div class="legend" id="cLegend"></div>
    </div>
  </div>

  <div class="card">
    <header><h2>Heat on the bead</h2></header>
    <div class="card-body">
      <!-- 받는 복사는 비슷하고 h가 다르다는 것을 숫자를 읽지 않고 보이게 한다 -->
      <div class="bar-group bar-group--rad">
        <div class="bar-head">Radiation absorbed <span class="unit">W/m²</span></div>
        <div id="cRadBars"></div>
      </div>
      <div class="bar-group bar-group--conv">
        <div class="bar-head">Cooling by air, h <span class="unit">W/m²K</span></div>
        <div id="cHBars"></div>
      </div>
    </div>
  </div>
  </div>
  </div>

</div>
