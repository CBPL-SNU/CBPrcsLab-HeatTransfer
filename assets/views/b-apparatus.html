<div class="conditions">
  <div class="input free"><label>Show</label>
    <div class="btn-row">
      <button class="btn toggle-layer is-active" data-layer="air" type="button" aria-pressed="true">Air up the duct</button>
      <button class="btn toggle-layer is-active" data-layer="radiation" type="button" aria-pressed="true">Radiation</button>
      <button class="btn toggle-layer is-active" data-layer="convection" type="button" aria-pressed="true">Convection</button>
    </div>
  </div>
</div>

<div class="content">

  <div class="card-grid wide-left">
  <div class="card">
    <header><h2>HT16 in section · the heated section to scale</h2><span class="click-hint">Click any part</span></header>
    <div class="card-body">
      <div class="apparatus-stage" id="bApparatusStage"></div>
    </div>
  </div>

  <div class="card-stack">
  <div class="card">
    <header><h2 id="bComponentTitle">—</h2><span class="badge" id="bComponentBadge">—</span></header>
    <div class="card-body">
      <p class="part-measure" id="bComponentMeasure" hidden>—</p>
      <p id="bComponentSummary">—</p>
    </div>
  </div>

  <div class="card">
    <header><h2>Parts</h2></header>
    <div class="card-body"><div class="part-list" id="bComponentList"></div></div>
  </div>

  <!-- 세 온도가 계산에 들어가는 자리. 계산 화면의 식과 같다 -->
  <div class="card">
    <header><h2>How T5, T10 and a bead enter the balance</h2></header>
    <div class="card-body">
      <p class="formula">
        <math><mrow><msub><mi>T</mi><mtext>bead</mtext></msub><mo>−</mo><msub><mi>T</mi><mn>5</mn></msub><mo>=</mo>
        <mfrac><msub><mi>h</mi><mi>r</mi></msub><msub><mi>h</mi><mi>c</mi></msub></mfrac>
        <mo>(</mo><msub><mi>T</mi><mn>10</mn></msub><mo>−</mo><msub><mi>T</mi><mtext>bead</mtext></msub><mo>)</mo></mrow></math>
      </p>
      <p class="assumption">A bead settles where the radiation it takes from T10 equals what convection carries off to T5.</p>
    </div>
  </div>
  </div>
  </div>

</div>
